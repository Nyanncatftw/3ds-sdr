name: Materialize 3DS binary
on:
  push:
    paths:
      - 'release/3ds-sdr.3dsx.b64'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode binary
        run: |
          mkdir -p release
          tr -d '\n\r' < release/3ds-sdr.3dsx.b64 | base64 -d > release/3ds-sdr.3dsx
          echo "9c21ed3be9dda91ff29788d2940a69d9802be679d92baec6f108bb0e5c93b5a0  release/3ds-sdr.3dsx" | sha256sum -c -
      - name: Commit binary and remove temporary materializer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/3ds-sdr.3dsx
          git rm release/3ds-sdr.3dsx.b64
          git rm .github/workflows/materialize-binary.yml
          git commit -m "Add prebuilt v0.1.0-beta 3DSX binary"
          git push
